<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IoT Sensor Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 20px;
      }
      h1 {
        color: #38bdf8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 20px;
      }
      .card {
        background: #1e293b;
        border-radius: 12px;
        padding: 20px;
      }
      .card h3 {
        margin-top: 0;
        color: #7dd3fc;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      .stat {
        font-size: 2rem;
        font-weight: bold;
        color: #f0f9ff;
      }
      .sub {
        color: #94a3b8;
        font-size: 0.8rem;
      }
      select {
        background: #334155;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        margin: 4px;
        cursor: pointer;
      }
      canvas {
        max-height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      // ── CONFIG ──────────────────────────────────────────────
      const API_BASE =
        "https://<API_ID>.execute-api.eu-west-1.amazonaws.com/prod/query";
      const SENSOR_TYPES = [
        "temperature",
        "humidity",
        "pressure",
        "co2",
        "vibration",
      ];
      const POLL_INTERVAL = 5000; // ms
      // ────────────────────────────────────────────────────────

      const UNITS = {
        temperature: "°C",
        humidity: "%RH",
        pressure: "hPa",
        co2: "ppm",
        vibration: "m/s²",
      };

      function SensorCard({ stype }) {
        const [readings, setReadings] = React.useState([]);
        const chartRef = React.useRef(null);
        const chartObj = React.useRef(null);

        const fetchData = async () => {
          const since = Math.floor(Date.now() / 1000) - 3600;
          try {
            const res = await fetch(`${API_BASE}?type=${stype}&since=${since}`);
            const json = await res.json();
            setReadings(json.readings || []);
          } catch (e) {
            console.error(e);
          }
        };

        React.useEffect(() => {
          fetchData();
          const interval = setInterval(fetchData, POLL_INTERVAL);
          return () => clearInterval(interval);
        }, [stype]);

        React.useEffect(() => {
          if (!chartRef.current || readings.length === 0) return;
          const labels = readings.map((r) =>
            new Date(r.timestamp * 1000).toLocaleTimeString(),
          );
          const means = readings.map((r) => parseFloat(r.mean) || 0);
          if (chartObj.current) chartObj.current.destroy();
          chartObj.current = new Chart(chartRef.current, {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: `Mean ${UNITS[stype]}`,
                  data: means,
                  borderColor: "#38bdf8",
                  backgroundColor: "rgba(56,189,248,0.1)",
                  tension: 0.4,
                  fill: true,
                  pointRadius: 2,
                },
              ],
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: "#94a3b8" } } },
              scales: {
                x: {
                  ticks: { color: "#64748b", maxTicksLimit: 8 },
                  grid: { color: "#1e293b" },
                },
                y: { ticks: { color: "#64748b" }, grid: { color: "#334155" } },
              },
            },
          });
        }, [readings]);

        const latest = readings[readings.length - 1];
        return (
          <div className="card">
            <h3>
              {stype} {UNITS[stype]}
            </h3>
            {latest ? (
              <>
                <div className="stat">
                  {parseFloat(latest.mean).toFixed(2)}{" "}
                  <span style={{ fontSize: "1rem" }}>{UNITS[stype]}</span>
                </div>
                <div className="sub">
                  Min: {latest.min} | Max: {latest.max} | Samples:{" "}
                  {latest.count}
                </div>
                <div className="sub">
                  Sensors: {(latest.sensor_ids || []).join(", ")}
                </div>
              </>
            ) : (
              <div className="sub">Awaiting data…</div>
            )}
            <canvas ref={chartRef} style={{ marginTop: "16px" }}></canvas>
          </div>
        );
      }

      function App() {
        return (
          <>
            <h1>🌡 IoT Sensor Dashboard</h1>
            <p style={{ color: "#64748b" }}>
              Live data from fog-node-01 · Auto-refreshes every 5s
            </p>
            <div className="grid">
              {SENSOR_TYPES.map((t) => (
                <SensorCard key={t} stype={t} />
              ))}
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
